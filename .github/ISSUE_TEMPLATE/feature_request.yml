name: Feature request
about: Suggest a new capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Keep it focused: small, clear requests are easier to turn into a first pull request. Check existing issues first, and remember that backend/schema changes belong in [NEEDS_API.md](../../NEEDS_API.md). A maintainer will add the `needs API contract` label when backend work is required.

  - type: input
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user or contributor need in one or two sentences.
      placeholder: "It is hard to find unread group chats when..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the app to do? Mention the relevant screens or components if you know them.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI
        - Tests
        - Docs
        - Accessibility (a11y)
        - PWA / offline
        - AI
        - Other
    validations:
      required: true

  - type: dropdown
    id: contract-impact
    attributes:
      label: Contract impact
      description: Does this need a database, RPC, Edge Function, or typed client change?
      options:
        - None — existing API is enough
        - Needs a backend/API change (document it in NEEDS_API.md)
        - Not sure — please help me check
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is done? Bullet points work well here.
      placeholder: |
        - [ ] ...
        - [ ] Unit test added
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one is better.
    validations:
      required: false

  - type: input
    id: related
    attributes:
      label: Related issue or discussion
      placeholder: "#123"
    validations:
      required: false
