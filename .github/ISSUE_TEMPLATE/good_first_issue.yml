name: Good first issue proposal
about: Propose a small, well-scoped task for a new contributor
title: "[Good first issue]: "
labels: ["good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to define a newcomer-friendly task, or to propose one. Keep it small and specific. If the work needs a database, RPC, or typed-client change, it is **not** a good first issue — ask a maintainer to record it in NEEDS_API.md and use the `needs API contract` label instead.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which kind of contribution is this?
      options:
        - UI
        - Tests
        - Docs
        - Accessibility (a11y)
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Expected effort
      description: A rough time estimate helps contributors choose.
      options:
        - Under 30 minutes
        - 30–60 minutes
        - 1–2 hours
        - Half a day
        - Not sure
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: What needs to be done?
      description: Describe the task in plain language, including any current behavior to fix.
    validations:
      required: true

  - type: input
    id: files
    attributes:
      label: Files to look at
      description: Give exact paths so a newcomer knows where to start.
      placeholder: "tests/e2e/messenger.spec.ts"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the checks a PR must satisfy. Include the test command where relevant.
      placeholder: |
        - [ ] One `test.fixme` journey in messenger.spec.ts is re-enabled and passing
        - [ ] `npm run test:e2e` passes locally
    validations:
      required: true

  - type: textarea
    id: skills
    attributes:
      label: Helpful background
      description: Skills or docs a contributor should read first. It is fine to say "none".
    validations:
      required: false

  - type: textarea
    id: why
    attributes:
      label: Why is this beginner-friendly?
      description: For example, no backend changes, an existing pattern to copy, or a small isolated file.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Contributors:** comment to claim this issue and wait to be assigned. See [CONTRIBUTING.md](../../CONTRIBUTING.md) for setup and PR guidance.
